name: Portföy fiyat verisi

# Neden: Claude bulut rutinlerinin sandbox'ından finans veri host'ları egress
# proxy tarafından 403 ile engelli; ayrıca sandbox, indirilen script'lerin çalıştırılmasını
# ("Code from External") engelliyor. GitHub Actions çalıştırıcısında bu engellerin hiçbiri yok.
#
# MİMARİ (3 Kasım 2026): bu iş akışı (1) fiyatları çeker, quotes.json'u işler ve (2) şifreli
# durumdan (state.enc) portföy sayfasını üretip "pages-data" dalına yayınlar. Claude bulut
# rutini hesap YAPMAZ; yalnızca hazır sayfayı artifact'e taşır. Veriler herkese açık depoda
# yalnızca AES-GCM şifreli durur; anahtar PORTFOY_KEY gizli değişkeninde ve artifact sayfasında.
#
# GÜVENİLİRLİK (3 Kasım 2026'da eklendi): GitHub'ın zamanlayıcısı "en iyi çaba"
# esaslı — yoğunlukta tetiklemeyi saatlerce geciktirebiliyor ya da hiç çalıştırmıyor
# (ölçülen gecikme: 6-9 saat). Tek tetikleme yetmiyor; bu yüzden her koşu penceresi
# için birkaç tetikleme var. Biri gecikse ya da düşse bir diğeri veriyi taze tutar.
# Dakikalar bilerek "yuvarlak olmayan" seçildi (:00/:05 en yoğun anlardır).
# Mod, tetikleme dizesine değil gerçek UTC saatine bakılarak seçilir; böylece
# gecikmiş bir tetikleme bile doğru modda koşar.

on:
  schedule:
    # sabah penceresi (rutin 06:35 UTC) — ABD açılışı öncesi
    - cron: '23 4 * * 1-5'
    - cron: '13 5 * * 1-5'
    - cron: '43 5 * * 1-5'
    - cron: '53 6 * * 1-5'
    # gün ortası tazeleme (elle koşu / yedek rutin için taze veri)
    - cron: '21 12 * * 1-5'
    # akşam penceresi (rutin 21:35 UTC) — ABD kapanışı sonrası (kışın kapanış 21:00 UTC)
    - cron: '47 20 * * 1-5'
    - cron: '8 21 * * 1-5'
    - cron: '22 21 * * 1-5'
    - cron: '13 22 * * 1-5'
    - cron: '43 22 * * 1-5'
    # pazar derin koşusu (rutin 17:30 UTC) — adaylar dahil, mod "pazar" olmalı
    - cron: '12 16 * * 0'
    - cron: '42 16 * * 0'
    - cron: '2 17 * * 0'
    - cron: '17 17 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Koşu modu'
        type: choice
        options: [aksam, sabah, pazar]
        default: aksam

permissions:
  contents: write

concurrency:
  group: portfoy-quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Modu belirle
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode || 'aksam' }}"
          else
            DOW=$(date -u +%u)            # 1=Pzt ... 7=Paz
            HOUR=$((10#$(date -u +%H)))
            if [ "$DOW" = "7" ] && [ "$HOUR" -ge 15 ] && [ "$HOUR" -le 18 ]; then
              MODE=pazar
            elif [ "$HOUR" -lt 12 ]; then
              MODE=sabah
            else
              MODE=aksam
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mod: $MODE"

      - name: Fiyatları çek
        run: |
          for i in 1 2 3; do
            python3 fetch_quotes.py --mode "${{ steps.m.outputs.mode }}" && exit 0
            echo "Deneme $i başarısız, 40 sn sonra tekrar"; sleep 40
          done
          exit 1

      - name: quotes.json'u işle
        run: |
          git config user.name  "portfoy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "veri: ${{ steps.m.outputs.mode }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Başka bir commit araya girerse (ben ya da başka bir koşu) push reddedilir;
          # rebase edip birkaç kez dene.
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push reddedildi, deneme $i — rebase ediliyor"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            sleep $((i * 5))
          done
          echo "push 4 denemede de başarısız" >&2
          exit 1

      - name: pages-data dalını getir
        id: pd
        run: |
          if git ls-remote --exit-code --heads origin pages-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch pages-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" pd
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages-data dalı yok; sayfa kurulumu atlanıyor"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sayfayı üret
        if: steps.pd.outputs.exists == 'true'
        env:
          PORTFOY_KEY: ${{ secrets.PORTFOY_KEY }}
        run: |
          if [ -z "$PORTFOY_KEY" ]; then
            echo "::error::PORTFOY_KEY gizli değişkeni tanımlı değil; sayfa üretilmedi."
            exit 1
          fi
          python3 -m pip install --quiet cryptography
          python3 ci/build_page.py --mode "${{ steps.m.outputs.mode }}" --state pd/state.enc --out out

      - name: pages-data dalını yayınla
        if: steps.pd.outputs.exists == 'true'
        run: |
          cd out
          git init --quiet -b pages-data
          git config user.name  "portfoy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html status.json state.enc state.prev.enc
          git commit --quiet -m "sayfa: ${{ steps.m.outputs.mode }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push --force --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" pages-data && exit 0
            sleep 10
          done
          exit 1
